name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Sync UI for embedding
        run: |
          rm -rf ui/dist
          cp -r web-ui/dist ui/

      - name: Build binaries
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF#refs/tags/}
          go build -ldflags "-s -w -X main.version=${VERSION}" -o dist/haify-controller ./cmd/controller
          go build -ldflags "-s -w" -o dist/haify ./cmd/cli
          go build -ldflags "-s -w -X main.version=${VERSION}" -o dist/haify-mcp ./cmd/mcp
          go build -ldflags "-s -w" -o dist/service-ip ./cmd/service-ip
          cp configs/service-ip@.service configs/haify-controller.service configs/controller.toml.example dist/
          chmod +x dist/haify-controller dist/haify dist/haify-mcp dist/service-ip

      - name: Create archive
        run: |
          cd dist
          tar -czf haify-linux-amd64.tar.gz haify-controller haify haify-mcp service-ip \
            service-ip@.service haify-controller.service controller.toml.example
          sha256sum haify-linux-amd64.tar.gz > haify-linux-amd64.tar.gz.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/haify-linux-amd64.tar.gz
            dist/haify-linux-amd64.tar.gz.sha256
