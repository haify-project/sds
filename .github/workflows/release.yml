name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Sync UI for embedding
        run: |
          rm -rf ui/dist
          cp -r web-ui/dist ui/

      - name: Build binaries
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF#refs/tags/}
          go build -ldflags "-s -w -X main.version=${VERSION}" -o dist/sds-controller ./cmd/controller
          go build -ldflags "-s -w -X main.version=${VERSION}" -o dist/sds-cli ./cmd/cli
          go build -ldflags "-s -w -X main.version=${VERSION}" -o dist/sds-mcp ./cmd/mcp
          chmod +x dist/sds-controller dist/sds-cli dist/sds-mcp

      - name: Create archive
        run: |
          cd dist
          tar -czf sds-linux-amd64.tar.gz sds-controller sds-cli sds-mcp
          sha256sum sds-linux-amd64.tar.gz > sds-linux-amd64.tar.gz.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sds-linux-amd64.tar.gz
            dist/sds-linux-amd64.tar.gz.sha256
