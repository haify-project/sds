[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "haify-cinder"
version = "1.0.0"
description = "OpenStack Cinder volume driver for Haify (DRBD) storage"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["haify_cinder"]
