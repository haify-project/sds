# Lets the SDS Copilot (sds-ai) create databases on SDS volumes — the app.create
# action. sds-ai runs outside the cluster on the control-plane nodes and reaches
# the API server with this ServiceAccount's token (SDS_AI_KUBECONFIG); see
# deploy/k8s/README.md.
#
# It can create the four objects an app is made of and read enough to report
# on them. It cannot update or delete anything: an app is removed by an
# operator, not by the Copilot.
apiVersion: v1
kind: Namespace
metadata:
  name: sds-ai
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sds-ai
  namespace: sds-ai
---
apiVersion: v1
kind: Secret
metadata:
  name: sds-ai-token
  namespace: sds-ai
  annotations:
    kubernetes.io/service-account.name: sds-ai
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sds-ai-apps
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets", "persistentvolumeclaims", "services"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sds-ai-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sds-ai-apps
subjects:
  - kind: ServiceAccount
    name: sds-ai
    namespace: sds-ai
