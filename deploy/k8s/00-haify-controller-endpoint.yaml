# Makes the in-cluster name `haify-controller:3374` resolve to the EXTERNAL
# haify-controller, which runs on the storage hosts (outside Kubernetes) behind
# an HA floating VIP. The controller is a plain IP, not a pod and not a DNS
# name, so we use a Service WITHOUT a selector plus a manually-defined
# EndpointSlice carrying the VIP. (ExternalName does not work here: the target is
# an IP address, not a hostname.)
#
# The Service name (`haify-controller`) and port (3374) are kept aligned with the
# shipped `--haify-controller=haify-controller:3374` arg in 20-controller.yaml and
# 30-node.yaml, so those defaults resolve unchanged.
---
apiVersion: v1
kind: Service
metadata:
  name: haify-controller
  namespace: kube-system
spec:
  # No selector: endpoints are defined manually below (external VIP target).
  ports:
    - name: grpc
      protocol: TCP
      port: 3374
      targetPort: 3374
---
# An EndpointSlice tied to the Service by the service-name label. (v1
# Endpoints is deprecated since Kubernetes 1.33 and warns on every apply.)
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: haify-controller
  namespace: kube-system
  labels:
    kubernetes.io/service-name: haify-controller   # MUST equal the Service name above.
addressType: IPv4
ports:
  - name: grpc       # MUST match the Service port name above.
    protocol: TCP
    port: 3374
endpoints:
  # CHANGE ME: your haify-controller VIP (from `haify ha self status`)
  - addresses: ["192.0.2.10"]
