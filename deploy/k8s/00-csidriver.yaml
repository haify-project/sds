apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: haify.csi.liliang-cn.com
spec:
  attachRequired: false
  podInfoOnMount: false
  volumeLifecycleModes:
    - Persistent
  # external-provisioner publishes each node's free pool space as
  # CSIStorageCapacity objects, and the scheduler does not place a Pod on a node
  # whose pool cannot hold its volume.
  storageCapacity: true
  # fsGroup ownership is applied on mount, so Pods running as non-root can write.
  fsGroupPolicy: File
