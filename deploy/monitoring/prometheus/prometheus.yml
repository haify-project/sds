global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/sds/prometheus-rules.yml
scrape_configs:
  - job_name: sds
    static_configs:
      # One target per cluster: the controller VIP (or address) and its
      # [metrics] port. Keep a cluster label on every target.
      - targets: ["controller-a.example.com:9433"]
        labels: {cluster: cluster-a}
      - targets: ["controller-b.example.com:9433"]
        labels: {cluster: cluster-b}
