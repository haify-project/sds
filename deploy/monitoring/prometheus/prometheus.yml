global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/sds/prometheus-rules.yml
scrape_configs:
  - job_name: sds
    static_configs:
      - targets: ["openclaw-vip:3381"]
        labels: {cluster: cluster-a}
      - targets: ["orange-vip:3381"]
        labels: {cluster: cluster-b}
