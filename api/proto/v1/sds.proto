syntax = "proto3";

package v1;

option go_package = "./;v1";

import "google/api/annotations.proto";

// SDS Controller Service
service SDSController {
  // Pool operations
  rpc CreatePool(CreatePoolRequest) returns (CreatePoolResponse) {
    option (google.api.http) = { post: "/v1/pools"; body: "*"; };
  }
  rpc DeletePool(DeletePoolRequest) returns (DeletePoolResponse) {
    option (google.api.http) = { delete: "/v1/pools/{name}"; };
  }
  rpc GetPool(GetPoolRequest) returns (GetPoolResponse) {
    option (google.api.http) = { get: "/v1/pools/{name}"; };
  }
  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse) {
    option (google.api.http) = { get: "/v1/pools"; };
  }
  rpc AddDiskToPool(AddDiskToPoolRequest) returns (AddDiskToPoolResponse) {
    option (google.api.http) = { post: "/v1/pools/{pool}/disks"; body: "*"; };
  }

  // Node operations
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes"; body: "*"; };
  }
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeResponse) {
    option (google.api.http) = { delete: "/v1/nodes/{address}"; };
  }
  rpc SetNodeLabels(SetNodeLabelsRequest) returns (SetNodeLabelsResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node}/labels"; body: "*"; };
  }
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse) {
    option (google.api.http) = { get: "/v1/nodes/{address}"; };
  }
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {
    option (google.api.http) = { get: "/v1/nodes"; };
  }
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = { get: "/v1/nodes/{node}/health"; };
  }

  // Resource operations
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse) {
    option (google.api.http) = { post: "/v1/resources"; body: "*"; };
  }
  rpc AdoptResource(AdoptResourceRequest) returns (AdoptResourceResponse) {
    option (google.api.http) = { post: "/v1/resources/{name}/adopt"; body: "*"; };
  }
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse) {
    option (google.api.http) = { delete: "/v1/resources/{name}"; };
  }
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse) {
    option (google.api.http) = { get: "/v1/resources/{name}"; };
  }
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse) {
    option (google.api.http) = { get: "/v1/resources"; };
  }
  rpc AddVolume(AddVolumeRequest) returns (AddVolumeResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/volumes"; body: "*"; };
  }
  rpc RemoveVolume(RemoveVolumeRequest) returns (RemoveVolumeResponse) {
    option (google.api.http) = { delete: "/v1/resources/{resource}/volumes/{volume_id}"; };
  }
  rpc ResizeVolume(ResizeVolumeRequest) returns (ResizeVolumeResponse) {
    option (google.api.http) = { patch: "/v1/resources/{resource}/volumes/{volume_id}"; body: "*"; };
  }
  rpc UpdateResourceOptions(UpdateResourceOptionsRequest) returns (UpdateResourceOptionsResponse) {
    option (google.api.http) = { post: "/v1/resources/{name}/options"; body: "*"; };
  }
  rpc ResourceStatus(ResourceStatusRequest) returns (ResourceStatusResponse) {
    option (google.api.http) = { get: "/v1/resources/{name}/status"; };
  }
  rpc SetPrimary(SetPrimaryRequest) returns (SetPrimaryResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/primary"; body: "*"; };
  }
  rpc SetSecondary(SetSecondaryRequest) returns (SetSecondaryResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/secondary"; body: "*"; };
  }
  rpc AttachDisklessClient(AttachDisklessClientRequest) returns (AttachDisklessClientResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/diskless-clients"; body: "*"; };
  }
  rpc DetachDisklessClient(DetachDisklessClientRequest) returns (DetachDisklessClientResponse) {
    option (google.api.http) = { delete: "/v1/resources/{resource}/diskless-clients/{node}"; };
  }
  rpc CreateFilesystem(CreateFilesystemRequest) returns (CreateFilesystemResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/volumes/{volume_id}/filesystem"; body: "*"; };
  }
  rpc MountResource(MountResourceRequest) returns (MountResourceResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/volumes/{volume_id}/mount"; body: "*"; };
  }
  rpc UnmountResource(UnmountResourceRequest) returns (UnmountResourceResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/volumes/{volume_id}/unmount"; body: "*"; };
  }
  rpc MakeHa(MakeHaRequest) returns (MakeHaResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/ha"; body: "*"; };
  }
  rpc EvictHa(EvictHaRequest) returns (EvictHaResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/ha/evict"; body: "*"; };
  }
  rpc DeleteHa(DeleteHaRequest) returns (DeleteHaResponse) {
    option (google.api.http) = { delete: "/v1/resources/{resource}/ha"; };
  }
  rpc GetHa(GetHaRequest) returns (GetHaResponse) {
    option (google.api.http) = { get: "/v1/resources/{resource}/ha"; };
  }
  rpc ListHa(ListHaRequest) returns (ListHaResponse) {
    option (google.api.http) = { get: "/v1/ha"; };
  }

  // HA OCF resource-agent discovery and drbd-reactor promoter TOML editing.
  rpc ListResourceAgents(ListResourceAgentsRequest) returns (ListResourceAgentsResponse) {
    option (google.api.http) = { get: "/v1/ha/resource-agents"; };
  }
  rpc GetResourceAgentMetadata(GetResourceAgentMetadataRequest) returns (GetResourceAgentMetadataResponse) {
    option (google.api.http) = { get: "/v1/ha/resource-agents/{provider}/{name}"; };
  }
  rpc GetHaToml(GetHaTomlRequest) returns (GetHaTomlResponse) {
    option (google.api.http) = { get: "/v1/ha/{resource}/toml"; };
  }
  rpc SyncHaToml(SyncHaTomlRequest) returns (SyncHaTomlResponse) {
    option (google.api.http) = { post: "/v1/ha/{resource}/toml"; body: "*"; };
  }

  // Controller self-HA operations: make the controller itself highly
  // available on its own DRBD + drbd-reactor machinery.
  rpc EnableSelfHa(EnableSelfHaRequest) returns (EnableSelfHaResponse) {
    option (google.api.http) = { post: "/v1/selfha/enable"; body: "*"; };
  }
  rpc DisableSelfHa(DisableSelfHaRequest) returns (DisableSelfHaResponse) {
    option (google.api.http) = { post: "/v1/selfha/disable"; body: "*"; };
  }
  rpc GetSelfHaStatus(GetSelfHaStatusRequest) returns (GetSelfHaStatusResponse) {
    option (google.api.http) = { get: "/v1/selfha"; };
  }

  // Snapshot operations. Volume identifiers are "<pool>/<lv>" paths, so the
  // REST bindings need the two-segment pattern {volume=*/*}; a plain
  // {volume} never matches a value containing a slash. The single-segment
  // binding is kept for backward compatibility.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/volumes/{volume=*/*}/snapshots"; body: "*";
      additional_bindings { post: "/v1/volumes/{volume}/snapshots"; body: "*"; }
    };
  }
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse) {
    option (google.api.http) = {
      delete: "/v1/volumes/{volume=*/*}/snapshots/{snapshot_name}";
      additional_bindings { delete: "/v1/volumes/{volume}/snapshots/{snapshot_name}"; }
    };
  }
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/volumes/{volume=*/*}/snapshots/{snapshot_name}/restore"; body: "*";
      additional_bindings { post: "/v1/volumes/{volume}/snapshots/{snapshot_name}/restore"; body: "*"; }
    };
  }
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {
    option (google.api.http) = {
      get: "/v1/volumes/{volume=*/*}/snapshots";
      additional_bindings { get: "/v1/volumes/{volume}/snapshots"; }
    };
  }

  // Snapshot schedule operations (cron-driven snapshots + GFS retention)
  rpc CreateSnapshotSchedule(CreateSnapshotScheduleRequest) returns (CreateSnapshotScheduleResponse) {
    option (google.api.http) = { post: "/v1/snapshot-schedules"; body: "*"; };
  }
  rpc ListSnapshotSchedules(ListSnapshotSchedulesRequest) returns (ListSnapshotSchedulesResponse) {
    option (google.api.http) = { get: "/v1/snapshot-schedules"; };
  }
  rpc DeleteSnapshotSchedule(DeleteSnapshotScheduleRequest) returns (DeleteSnapshotScheduleResponse) {
    option (google.api.http) = { delete: "/v1/snapshot-schedules/{name}"; };
  }

  // Gateway operations
  rpc CreateNFSGateway(CreateNFSGatewayRequest) returns (CreateNFSGatewayResponse) {
    option (google.api.http) = { post: "/v1/gateways/nfs"; body: "*"; };
  }
  rpc CreateISCSIGateway(CreateISCSIGatewayRequest) returns (CreateISCSIGatewayResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi"; body: "*"; };
  }
  rpc CreateNVMeGateway(CreateNVMeGatewayRequest) returns (CreateNVMeGatewayResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme"; body: "*"; };
  }
  rpc DeleteGateway(DeleteGatewayRequest) returns (DeleteGatewayResponse) {
    option (google.api.http) = { delete: "/v1/gateways/{id}"; };
  }
  rpc GetGateway(GetGatewayRequest) returns (GetGatewayResponse) {
    option (google.api.http) = { get: "/v1/gateways/{id}"; };
  }
  rpc ListGateways(ListGatewaysRequest) returns (ListGatewaysResponse) {
    option (google.api.http) = { get: "/v1/gateways"; };
  }
  rpc StartGateway(StartGatewayRequest) returns (StartGatewayResponse) {
    option (google.api.http) = { post: "/v1/gateways/{id}/start"; body: "*"; };
  }
  rpc StopGateway(StopGatewayRequest) returns (StopGatewayResponse) {
    option (google.api.http) = { post: "/v1/gateways/{id}/stop"; body: "*"; };
  }
  rpc AddNFSExport(AddNFSExportRequest) returns (AddNFSExportResponse) {
    option (google.api.http) = { post: "/v1/gateways/nfs/exports:add"; body: "*"; };
  }
  rpc RemoveNFSExport(RemoveNFSExportRequest) returns (RemoveNFSExportResponse) {
    option (google.api.http) = { post: "/v1/gateways/nfs/exports:remove"; body: "*"; };
  }
  rpc ListNFSExports(ListNFSExportsRequest) returns (ListNFSExportsResponse) {
    option (google.api.http) = { post: "/v1/gateways/nfs/exports:list"; body: "*"; };
  }
  rpc AddISCSILUN(AddISCSILUNRequest) returns (AddISCSILUNResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/luns:add"; body: "*"; };
  }
  rpc RemoveISCSILUN(RemoveISCSILUNRequest) returns (RemoveISCSILUNResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/luns:remove"; body: "*"; };
  }
  rpc ListISCSILUNs(ListISCSILUNsRequest) returns (ListISCSILUNsResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/luns:list"; body: "*"; };
  }
  rpc AddISCSIInitiator(AddISCSIInitiatorRequest) returns (AddISCSIInitiatorResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/initiators:add"; body: "*"; };
  }
  rpc RemoveISCSIInitiator(RemoveISCSIInitiatorRequest) returns (RemoveISCSIInitiatorResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/initiators:remove"; body: "*"; };
  }
  rpc ListISCSIInitiators(ListISCSIInitiatorsRequest) returns (ListISCSIInitiatorsResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/initiators:list"; body: "*"; };
  }
  rpc SetISCSIChap(SetISCSIChapRequest) returns (SetISCSIChapResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/chap:set"; body: "*"; };
  }
  rpc GetISCSIChap(GetISCSIChapRequest) returns (GetISCSIChapResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/chap:get"; body: "*"; };
  }
  rpc AddNVMeNamespace(AddNVMeNamespaceRequest) returns (AddNVMeNamespaceResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/namespaces:add"; body: "*"; };
  }
  rpc RemoveNVMeNamespace(RemoveNVMeNamespaceRequest) returns (RemoveNVMeNamespaceResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/namespaces:remove"; body: "*"; };
  }
  rpc ListNVMeNamespaces(ListNVMeNamespacesRequest) returns (ListNVMeNamespacesResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/namespaces:list"; body: "*"; };
  }
  rpc AddNVMeHost(AddNVMeHostRequest) returns (AddNVMeHostResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/hosts:add"; body: "*"; };
  }
  rpc RemoveNVMeHost(RemoveNVMeHostRequest) returns (RemoveNVMeHostResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/hosts:remove"; body: "*"; };
  }
  rpc ListNVMeHosts(ListNVMeHostsRequest) returns (ListNVMeHostsResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/hosts:list"; body: "*"; };
  }

  // ZFS operations
  rpc CreateZFSPool(CreateZFSPoolRequest) returns (CreateZFSPoolResponse) {
    option (google.api.http) = { post: "/v1/zfs/pools"; body: "*"; };
  }
  rpc DeleteZFSPool(DeleteZFSPoolRequest) returns (DeleteZFSPoolResponse) {
    option (google.api.http) = { delete: "/v1/zfs/pools/{name}"; };
  }
  rpc ListZFSpools(ListZFSPoolsRequest) returns (ListZFSPoolsResponse);
  rpc CreateZFSDataset(CreateZFSDatasetRequest) returns (CreateZFSDatasetResponse) {
    option (google.api.http) = { post: "/v1/zfs/datasets"; body: "*"; };
  }
  rpc CreateZFSVolume(CreateZFSVolumeRequest) returns (CreateZFSVolumeResponse) {
    option (google.api.http) = { post: "/v1/zfs/volumes"; body: "*"; };
  }
  rpc ResizeZFSVolume(ResizeZFSVolumeRequest) returns (ResizeZFSVolumeResponse) {
    option (google.api.http) = {
      patch: "/v1/zfs/volumes/{volume_path=*/*}"; body: "*";
      additional_bindings { patch: "/v1/zfs/volumes/{volume_path}"; body: "*"; }
    };
  }
  rpc DeleteZFSDataset(DeleteZFSDatasetRequest) returns (DeleteZFSDatasetResponse) {
    option (google.api.http) = {
      delete: "/v1/zfs/datasets/{dataset_path=*/*}";
      additional_bindings { delete: "/v1/zfs/datasets/{dataset_path}"; }
    };
  }

  // ZFS Snapshot operations
  // ZFS snapshot identifiers are "<pool>/<dataset>" (and
  // "<pool>/<dataset>@<snap>") paths; single-segment {param} patterns never
  // match values containing '/', so two-segment bindings come first.
  // Deeply nested datasets (pool/a/b) are not reachable over REST.
  rpc CreateZFSSnapshot(CreateZFSSnapshotRequest) returns (CreateZFSSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/zfs/datasets/{dataset=*/*}/snapshots"; body: "*";
      additional_bindings { post: "/v1/zfs/datasets/{dataset}/snapshots"; body: "*"; }
    };
  }
  rpc DeleteZFSSnapshot(DeleteZFSSnapshotRequest) returns (DeleteZFSSnapshotResponse) {
    option (google.api.http) = {
      delete: "/v1/zfs/snapshots/{snapshot=*/*}";
      additional_bindings { delete: "/v1/zfs/snapshots/{snapshot}"; }
    };
  }
  rpc ListZFSSnapshots(ListZFSSnapshotsRequest) returns (ListZFSSnapshotsResponse) {
    option (google.api.http) = {
      get: "/v1/zfs/datasets/{dataset=*/*}/snapshots";
      additional_bindings { get: "/v1/zfs/datasets/{dataset}/snapshots"; }
    };
  }
  rpc RestoreZFSSnapshot(RestoreZFSSnapshotRequest) returns (RestoreZFSSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/zfs/datasets/{dataset=*/*}/snapshots/{snapshot_name}/restore"; body: "*";
      additional_bindings { post: "/v1/zfs/datasets/{dataset}/snapshots/{snapshot_name}/restore"; body: "*"; }
    };
  }
  rpc CloneZFSSnapshot(CloneZFSSnapshotRequest) returns (CloneZFSSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/zfs/snapshots/{snapshot=*/*}/clone"; body: "*";
      additional_bindings { post: "/v1/zfs/snapshots/{snapshot}/clone"; body: "*"; }
    };
  }

  // LVM Snapshot operations
  rpc CreateLvmSnapshot(CreateLvmSnapshotRequest) returns (CreateLvmSnapshotResponse) {
    option (google.api.http) = { post: "/v1/lvm/volumes/{lv_name}/snapshots"; body: "*"; };
  }
  rpc DeleteLvmSnapshot(DeleteLvmSnapshotRequest) returns (DeleteLvmSnapshotResponse) {
    option (google.api.http) = { delete: "/v1/lvm/volumes/{lv_name}/snapshots/{snapshot_name}"; };
  }
  rpc ListLvmSnapshots(ListLvmSnapshotsRequest) returns (ListLvmSnapshotsResponse) {
    option (google.api.http) = { get: "/v1/lvm/volumes/{lv_name}/snapshots"; };
  }
  rpc RestoreLvmSnapshot(RestoreLvmSnapshotRequest) returns (RestoreLvmSnapshotResponse) {
    option (google.api.http) = { post: "/v1/lvm/volumes/{lv_name}/snapshots/{snapshot_name}/restore"; body: "*"; };
  }
}

// Pool messages
message CreatePoolRequest {
  string name = 1;
  string type = 2;
  string node = 3;
  repeated string disks = 4;
  uint64 size_gb = 5;
}

message CreatePoolResponse {
  bool success = 1;
  string message = 2;
}

message DeletePoolRequest {
  string name = 1;
  string node = 2;
}

message DeletePoolResponse {
  bool success = 1;
  string message = 2;
}

message GetPoolRequest {
  string name = 1;
  string node = 2;
}

message GetPoolResponse {
  bool success = 1;
  string message = 2;
  PoolInfo pool = 3;
}

message ListPoolsRequest {}

message ListPoolsResponse {
  bool success = 1;
  string message = 2;
  repeated PoolInfo pools = 3;
}

message AddDiskToPoolRequest {
  string pool = 1;
  string disk = 2;
  string node = 3;
}

message AddDiskToPoolResponse {
  bool success = 1;
  string message = 2;
}

message PoolInfo {
  string name = 1;
  string type = 2;
  string node = 3;
  uint64 total_gb = 4;
  uint64 free_gb = 5;
  repeated string devices = 6;
  bool thin = 7;
  string compression = 8;
}

// ZFS messages
message CreateZFSPoolRequest {
  string name = 1;
  string node = 2;
  repeated string vdevs = 3;
  // Field 4 (bool thin) removed: ZFS has no pool-level thin/thick.
  // Thin vs thick provisioning is a zvol-level property (zfs create -s -V
  // / refreservation), handled by CreateZFSVolume, not pool creation.
  reserved 4;
  reserved "thin";
}

message CreateZFSPoolResponse {
  bool success = 1;
  string message = 2;
}

message DeleteZFSPoolRequest {
  string name = 1;
  string node = 2;
}

message DeleteZFSPoolResponse {
  bool success = 1;
  string message = 2;
}

message ListZFSPoolsRequest {}

message ListZFSPoolsResponse {
  bool success = 1;
  string message = 2;
  repeated PoolInfo pools = 3;
}

message CreateZFSDatasetRequest {
  string dataset_path = 1;
  string node = 2;
}

message CreateZFSDatasetResponse {
  bool success = 1;
  string message = 2;
}

message CreateZFSVolumeRequest {
  string pool_name = 1;
  string volume_name = 2;
  string size = 3;
  string node = 4;
}

message CreateZFSVolumeResponse {
  bool success = 1;
  string message = 2;
}

message ResizeZFSVolumeRequest {
  string volume_path = 1;
  string new_size = 2;
  string node = 3;
}

message ResizeZFSVolumeResponse {
  bool success = 1;
  string message = 2;
}

message DeleteZFSDatasetRequest {
  string dataset_path = 1;
  string node = 2;
}

message DeleteZFSDatasetResponse {
  bool success = 1;
  string message = 2;
}

message CreateZFSSnapshotRequest {
  string dataset = 1;
  string snapshot_name = 2;
  string node = 3;
}

message CreateZFSSnapshotResponse {
  bool success = 1;
  string message = 2;
}

message DeleteZFSSnapshotRequest {
  string snapshot = 1;
  string node = 2;
}

message DeleteZFSSnapshotResponse {
  bool success = 1;
  string message = 2;
}

message ListZFSSnapshotsRequest {
  string dataset = 1;
  string node = 2;
}

message ListZFSSnapshotsResponse {
  bool success = 1;
  string message = 2;
  repeated SnapshotInfo snapshots = 3;
}

message RestoreZFSSnapshotRequest {
  string dataset = 1;
  string snapshot_name = 2;
  string node = 3;
}

message RestoreZFSSnapshotResponse {
  bool success = 1;
  string message = 2;
}

message CloneZFSSnapshotRequest {
  string snapshot = 1;
  string clone_path = 2;
  string node = 3;
}

message CloneZFSSnapshotResponse {
  bool success = 1;
  string message = 2;
}

// LVM Snapshot messages
message CreateLvmSnapshotRequest {
  string resource = 1;
  string lv_name = 2;
  string snapshot_name = 3;
  string node = 4;
  string size = 5;  // e.g., "1G"
}

message CreateLvmSnapshotResponse {
  bool success = 1;
  string message = 2;
}

message DeleteLvmSnapshotRequest {
  string lv_name = 1;
  string snapshot_name = 2;
  string node = 3;
}

message DeleteLvmSnapshotResponse {
  bool success = 1;
  string message = 2;
}

message ListLvmSnapshotsRequest {
  string lv_name = 1;
  string node = 2;
}

message ListLvmSnapshotsResponse {
  bool success = 1;
  string message = 2;
  repeated SnapshotInfo snapshots = 3;
}

message RestoreLvmSnapshotRequest {
  string lv_name = 1;
  string snapshot_name = 2;
  string node = 3;
}

message RestoreLvmSnapshotResponse {
  bool success = 1;
  string message = 2;
}

// Node messages
message RegisterNodeRequest {
  string address = 1;
  string name = 2;
}

message RegisterNodeResponse {
  bool success = 1;
  string message = 2;
  NodeInfo node = 3;
}

// SetNodeLabels sets or merges key=value labels on a node. When replace is
// true the node's labels are replaced wholesale; otherwise the given labels are
// merged in (a label with an empty value deletes that key).
message SetNodeLabelsRequest {
  string node = 1; // node name or address
  map<string, string> labels = 2;
  bool replace = 3;
}

message SetNodeLabelsResponse {
  bool success = 1;
  string message = 2;
  NodeInfo node = 3;
}

message UnregisterNodeRequest {
  string address = 1;
}

message UnregisterNodeResponse {
  bool success = 1;
  string message = 2;
}

message GetNodeRequest {
  string address = 1;
}

message GetNodeResponse {
  bool success = 1;
  string message = 2;
  NodeInfo node = 3;
}

message ListNodesRequest {}

message ListNodesResponse {
  bool success = 1;
  string message = 2;
  repeated NodeInfo nodes = 3;
}

message NodeInfo {
  string name = 1;
  string address = 2;
  string hostname = 3;
  string state = 4;
  int64 last_seen = 5;
  string version = 6;
  // labels are arbitrary key=value tags on the node (e.g. rack=A, zone=east)
  // used by placement constraints like replicas_on_different.
  map<string, string> labels = 7;
}

// Health check messages
message HealthCheckRequest {
  string node = 1;
}

message HealthCheckResponse {
  bool success = 1;
  string message = 2;
  NodeHealthInfo health = 3;
}

message NodeHealthInfo {
  bool drbd_installed = 1;
  string drbd_version = 2;
  bool drbd_reactor_installed = 3;
  string drbd_reactor_version = 4;
  bool drbd_reactor_running = 5;
  bool resource_agents_installed = 6;
  repeated string available_agents = 7;
}

// Resource messages
message CreateResourceRequest {
  string name = 1;
  uint32 port = 2;
  repeated string nodes = 3;
  string protocol = 4;
  uint32 size_gb = 5;  // single-volume shorthand; ignored when `volumes` is set
  string pool = 6;     // single-volume shorthand; ignored when `volumes` is set
  string storage_type = 7;  // "lvm", "lvm-thin" or "zfs" (applies to all volumes)
  map<string, string> drbd_options = 8;
  // volumes lists one or more DRBD volumes to create atomically (volume 0..N).
  // When empty, a single volume is created from size_gb/pool for back-compat.
  repeated VolumeSpec volumes = 9;

  // WAN replication (opt-in add-on). Absent/false ⇒ LAN, behaves exactly as
  // before. `wan` is the master switch; without it the dr_* fields are rejected.
  // See docs/2026-07-05-wan-replication-design.md.
  bool wan = 10;            // route this resource over the internet via a per-resource sds-proxy pair
  string dr_node = 11;      // the DR-site node (must be a registered node); WAN only
  string dr_endpoint = 12;  // the DR site's public WAN address the primary dials; WAN only
  uint32 wan_port = 13;     // WAN mTLS port (default a random >3000 per resource); WAN only

  // replicas requests auto-placement: when `nodes` is empty the controller
  // picks this many nodes (most free space in the target pool first). Ignored
  // when `nodes` is set. 0 means "not auto-placing" unless nodes is also empty,
  // in which case the controller defaults to 2.
  uint32 replicas = 14;
  // replicas_on_different names node-label keys (e.g. "rack"); during
  // auto-placement each replica is put in a distinct value of every listed
  // label, so a single fault domain never holds two replicas. Only nodes
  // carrying the labels participate. Empty = capacity-only. Ignored when `nodes`
  // is set. (Wire-compatible successor of the earlier singular string field.)
  repeated string replicas_on_different = 15;
  // replicas_on_same names node-label keys whose value must be IDENTICAL across
  // all replicas (e.g. keep every copy in one zone). Composable with
  // replicas_on_different. Ignored when `nodes` is set.
  repeated string replicas_on_same = 16;
  // do_not_place_with names other resources; auto-placement will not put a
  // replica on any node already holding a replica of them (cross-resource
  // anti-affinity). Ignored when `nodes` is set.
  repeated string do_not_place_with = 17;
}

// VolumeSpec is one DRBD volume within a resource. storage_type comes from the
// resource; each volume may target its own pool.
message VolumeSpec {
  uint32 size_gb = 1;
  string pool = 2;  // optional; auto-selected when empty
}

