# SDS AI Copilot — oss-agent domain config.
#
# Consumed by `oss-agent serve` (see ai/README.md). Defines the SDS/DRBD persona,
# the ontology vocabulary, destructive-command red-lines, and read-only probes.
# Live cluster state comes primarily from the `sds-mcp` read-only tools (wired via
# Config.MCPServers, not from this file); knowledge grounding comes from the
# drbd-reactor cortexdb knowledge base (Config.KnowledgeDBPath).

name = "SDS storage/HA domain"
title = "SDS Copilot"

persona = '''
You are an expert SRE copilot for SDS, a DRBD-based software-defined storage
controller managing storage pools, DRBD resources, snapshots, HA (drbd-reactor
promoter configs + floating VIPs), and gateways (NFS / iSCSI / NVMe-oF) across a
Linux cluster.

How you work:
- Reason step by step (ReAct). When you need live cluster state, call the
  read-only sds tools (they are strictly read-only: list/status/health). Do not
  assume state you can observe.
- Be efficient with tools. Prefer the LIST tools that return everything in one
  call: `sds_ha_list` already returns every HA resource with its primary node,
  VIP, mount and status — call it ONCE for questions about HA resources. Do NOT
  call `sds_ha_status`/`sds_resource_status` per-resource in a loop; only drill
  into one resource when the list is insufficient for that specific resource.
  Never re-call a tool you already called with the same arguments.
- Search the knowledge base FIRST, on essentially every question — before you
  answer from what you already know. It is not a reference for DRBD trivia; it
  is this cluster's own memory: incident notes about named machines, what was
  tried and failed, why a past workaround was abandoned. Those notes routinely
  contradict generic best practice, and a generically correct answer given while
  such a note exists is the worst outcome available — it sends an operator to do
  the exact thing that already failed here. If a question mentions a host, a
  resource, a symptom or a past event by name, that is a search, not a recall.
  Cite what you used.
- The knowledge base also holds SDS's OWN SOURCE CODE as a graph: files,
  functions, classes and the calls/imports/contains edges between them, for
  pkg/controller, pkg/gateway, pkg/reactor, pkg/csi, cmd/* and the Proxmox
  plugin. So questions about how SDS is implemented — which function writes a
  promoter config, what the CSI attach path does, where a gRPC handler lives —
  are knowledge_search questions too. Search it before answering.
- NEVER invent a function name, file path or call chain. There is no tool here
  that reads or greps the working tree, so an identifier you did not retrieve
  from the knowledge base is a guess, and a guess dressed as a code reference is
  worse than "I could not find it" — it sends an operator to a file that does
  not exist. If a search returns nothing, say what you searched for and stop.
- Explain findings concretely in terms of the actual resources, nodes, promoter
  configs, and OCF start-list entries you observed.

Proposing changes (guarded):
- You NEVER change the cluster yourself. When a change is warranted, call the
  `suggest_action` tool with a structured proposal (action, params, reason,
  severity). The operator reviews and approves it in the UI; only then does the
  existing controller execute it.
- Prefer the smallest safe action. Give the reason and the expected effect.
- Use these EXACT action ids and params (the UI can only execute these):
    - "ha.evict"        params: {resource}                     — fail a resource's primary over to another node
    - "ha.create"       params: {resource, vip, mountPoint, fstype, services}
    - "snapshot.create" params: {volume, snapshotName, node}
  Propose exactly ONE action per turn unless asked for more; do not duplicate it.

Safety (non-negotiable):
- A deterministic red-line wall, independent of you, flags data-destroying
  operations (wipefs, dd to a device, mkfs, lvremove/vgremove, zfs/zpool destroy,
  and destructive SDS verbs like deleting a pool/resource/gateway). Never present
  such an operation as a one-liner to run; explain the risk, the affected
  volumes, and the backup precondition, and defer to explicit operator approval.
'''

# ---------------------------------------------------------------------------
# Ontology. Both lists go into the extraction prompt verbatim — "Use ONLY these
# entity types" / "Use ONLY these relation types" — once per ingested chunk, and
# nothing downstream reconciles one chunk's vocabulary with the next one's. So
# the vocabulary has to be closed here or it is not closed at all: eight
# paragraphs about the same failover become eight private spellings of it, and a
# graph whose edges are spelled six ways is a graph nobody can walk.
#
# Naming follows the RDF/schema.org split of classes from predicates: node types
# PascalCase, edge types lower_snake. The edge half is not a style choice — see
# the relation_types note below.
#
# Node types are the things an operator names in a sentence: the storage stack
# (node → pool → resource → volume → replica), the things that protect it
# (snapshots, schedules, backups, targets), the things that serve it (gateways,
# promoter configs, OCF agents, VIPs), and the things you read when it breaks
# (states, events, error strings, config parameters, CLI commands). What is
# deliberately NOT a type here is any *variant* of one: a pool's lvm/lvm-thin/zfs
# kind, a gateway's NFS/iSCSI/NVMe-oF protocol, a replica's Primary/Secondary
# role or its diskless tiebreaker duty. Those are properties of an instance, and
# promoting them would both grow this list with every enum SDS gains and force
# the model to choose between two types that mean the same thing. "Cluster" is
# gone for the opposite reason: there is one, every chunk is about it, so it
# became a hub that connected everything and distinguished nothing.
entity_types = [
  "Node", "StoragePool", "BlockDevice", "DRBDResource", "Volume", "Replica",
  "Snapshot", "SnapshotSchedule", "Backup", "BackupTarget",
  "Gateway", "HAConfig", "PromoterConfig", "OCFAgent", "VIP",
  "WANTunnel", "LUKSContainer",
  "Event", "NotificationChannel", "RBACRole",
  "SystemdService", "Package", "KernelModule",
  "ConfigParameter", "CLICommand", "State", "ErrorCode",
]

# Edges are chosen for what we want to walk when answering an operator, not for
# everything the docs can express: what backs this resource, which node exports
# this gateway, what protects it, what this state means and what clears it.
#
# The spelling is forced. `knowledge_search` retrieves, then expands one hop
# along a FIXED edge list built into oss-agent — calls, contains, depends_on,
# inherits, implements, triggers, deploys, related — compared by exact string
# equality. An edge type outside that list is not weakly matched, it is simply
# never followed, which is why the earlier SCREAMING_SNAKE set produced a graph
# that looked populated and expanded to nothing: DEPLOYED_ON is not deploys.
# The first row below is therefore spelled to land inside that list and carries
# the questions worth a hop; calls/inherits/implements are left to the C sources
# already in the knowledge base, since nothing in a storage doc inherits.
# The rest are domain edges: not expanded today, but they are what makes an
# extracted node say something true about its neighbour rather than "related",
# and they are reachable by entity-scoped queries over the graph.
relation_types = [
  "contains", "depends_on", "deploys", "triggers", "related",
  "backs", "exports", "promotes", "replicates_to", "protects", "stored_on",
  "caches", "notifies", "resolves", "configured_by", "conflicts_with",
  "has_state",
]

# Regex sources (TOML literal strings preserve backslashes). Group 1 = message.
# Mine the log/error string literals an operator actually sees, so a real error
# line can be traced back to its source.
error_patterns = [
  '(?:printk|pr_err|pr_warn|pr_crit|dev_err|dev_warn)\s*\([^"]*"([^"]{8,})"',
  'fprintf\s*\(\s*stderr\s*,\s*"([^"]{8,})"',
  '\blog_(?:err|error|warn|warning|crit)\s*\([^"]*"([^"]{8,})"',
  '\bperror\s*\(\s*"([^"]{6,})"',
  '(?:zap\.\w+|logger\.\w+|fmt\.Errorf)\s*\(\s*"([^"]{8,})"',
]

# Knowledge is already ingested into drbd-reactor.db; no repos to (re)ingest here.
repos = []

# ---------------------------------------------------------------------------
# Code vocabulary — the admission list for `oss-agent ingest-repo`, which
# imports an Understand-Anything knowledge-graph.json (AST + LLM analysis of a
# real repository). Deliberately separate from the prose vocabulary above: the
# prose lists are pasted into the LLM extractor's prompt, and telling a prose
# extractor it may emit `function` and `calls` invites it to invent code
# structure out of documentation. This list is consumed only by the importer,
# which REFUSES a whole graph containing any type not declared here — so if
# Understand-Anything grows a new type, the import fails loudly with a
# histogram naming it, and the fix is one line below.
#
# The lists are Understand-Anything's own unions (packages/core/src/types.ts,
# v2.8.1). lower_snake, matching what a deterministic extractor emits; the
# case split against the prose vocabulary is what keeps "a file contains a
# function" from merging with "a cluster contains a node".
# ---------------------------------------------------------------------------

[vocabulary.code]
resolution = "syntactic" # name matching over a parse tree; Go `implements` is a guess
entity_types = [
  "file", "function", "class", "module", "concept",
  "config", "document", "service", "table", "endpoint",
  "pipeline", "schema", "resource",
  "domain", "flow", "step",
  "article", "entity", "topic", "claim", "source",
]
relation_types = [
  # structural
  "imports", "exports", "contains", "inherits", "implements",
  # behavioral
  "calls", "subscribes", "publishes", "middleware",
  # data flow
  "reads_from", "writes_to", "transforms", "validates",
  # dependencies
  "depends_on", "tested_by", "configures",
  # semantic
  "related", "similar_to",
  # infrastructure
  "deploys", "serves", "provisions", "triggers",
  # schema/data
  "migrates", "documents", "routes", "defines_schema",
  # domain
  "contains_flow", "flow_step", "cross_domain",
  # knowledge
  "cites", "contradicts", "builds_on", "exemplifies", "categorized_under", "authored_by",
]

# ---------------------------------------------------------------------------
# Deterministic destructive-command red-lines (LLM-independent). Applied to the
# string form of a suggested action / any command, before an operator can approve.
# ---------------------------------------------------------------------------

[[red_lines]]
id = "wipefs"
severity = "CRITICAL"
pattern = '\bwipefs\b'
reason = "wipefs erases filesystem signatures; data irreversibly lost"

[[red_lines]]
id = "dd-to-device"
severity = "CRITICAL"
pattern = '\bdd\b.*\bof=/dev/'
reason = "dd to a block device overwrites raw disk data"

[[red_lines]]
id = "mkfs"
severity = "CRITICAL"
pattern = '\bmkfs(\.\w+)?\b'
reason = "mkfs rebuilds a filesystem, wiping the target device"

[[red_lines]]
id = "lvremove"
severity = "CRITICAL"
pattern = '\blvremove\b'
reason = "lvremove deletes a logical volume; data on it is lost"

[[red_lines]]
id = "vgremove"
severity = "CRITICAL"
pattern = '\bvgremove\b'
reason = "vgremove deletes a volume group"

[[red_lines]]
id = "zfs-destroy"
severity = "CRITICAL"
pattern = '\bzfs\b.*\bdestroy\b'
reason = "zfs destroy deletes a dataset/volume/snapshot"

[[red_lines]]
id = "zpool-destroy"
severity = "CRITICAL"
pattern = '\bzpool\b.*\bdestroy\b'
reason = "zpool destroy destroys an entire storage pool"

[[red_lines]]
id = "drbdadm-wipe-md"
severity = "CRITICAL"
pattern = '\bdrbdadm\b.*\b(wipe-md|create-md)\b'
reason = "wipe-md/create-md rewrites DRBD metadata; can lose the replica"

# Destructive SDS control verbs. These map to controller operations that delete
# managed objects — recoverable only from backups/snapshots, so flag before approve.
[[red_lines]]
id = "sds-pool-delete"
severity = "HIGH"
pattern = '\bpool[._-]?delete\b'
reason = "deleting a storage pool destroys its volumes"

[[red_lines]]
id = "sds-resource-delete"
severity = "HIGH"
pattern = '\bresource[._-]?delete\b'
reason = "deleting a DRBD resource tears down replication and its backing volumes"

[[red_lines]]
id = "sds-ha-delete"
severity = "HIGH"
pattern = '\bha[._-]?delete\b'
reason = "deleting an HA config removes the promoter and floating VIP failover"

[[red_lines]]
id = "sds-gateway-delete"
severity = "HIGH"
pattern = '\bgateway[._-]?delete\b'
reason = "deleting a gateway stops exporting the storage (NFS/iSCSI/NVMe-oF)"

[[red_lines]]
id = "sds-snapshot-delete"
severity = "HIGH"
pattern = '\bsnapshot[._-]?delete\b'
reason = "deleting a snapshot discards a recovery point"

# ---------------------------------------------------------------------------
# Read-only probes (fallback situational awareness on the host running serve).
# Primary cluster state comes from the sds-mcp read tools; these are extra.
# ---------------------------------------------------------------------------

[[probes]]
name = "drbd_status"
description = "Show DRBD resource roles, connection and disk state."
argv = ["drbdadm", "status"]

[[probes]]
name = "reactor_prom_list"
description = "List drbd-reactor promoter targets and which node holds each."
argv = ["drbd-reactorctl", "status"]

[[probes]]
name = "vgs"
description = "Show LVM volume groups and free space."
argv = ["vgs"]

[[probes]]
name = "zpool_status"
description = "Show ZFS pool health and device status."
argv = ["zpool", "status"]
